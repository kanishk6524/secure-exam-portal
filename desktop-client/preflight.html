<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Secure Exam Client</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  main { width: min(640px, 92vw); background: #1e293b; border-radius: 12px; padding: 32px; box-shadow: 0 10px 40px #0008; }
  h1 { margin: 0 0 4px; font-size: 22px; } p.sub { margin: 0 0 20px; color: #94a3b8; font-size: 14px; }
  ul { list-style: none; padding: 0; margin: 0 0 20px; } li { padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; background: #0f172a; font-size: 14px; }
  li.ok { border-left: 4px solid #22c55e; } li.bad { border-left: 4px solid #ef4444; } li small { display: block; color: #94a3b8; margin-top: 2px; }
  button { background: #2563eb; color: white; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; margin-right: 8px; }
  button.secondary { background: #334155; } button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<main>
  <h1>Secure Exam Client</h1>
  <p class="sub">Checking this computer before the exam. Close prohibited applications and disconnect extra displays.</p>
  <ul id="results"><li>Running checks…</li></ul>
  <button id="start" disabled>Open exam portal</button>
  <button id="recheck" class="secondary">Re-check</button>
</main>
<script>
  const list = document.getElementById("results"), start = document.getElementById("start"), recheck = document.getElementById("recheck")
  async function check() {
    start.disabled = true; list.innerHTML = "<li>Running checks…</li>"
    const result = await window.secureClientLocal.runChecks()
    list.innerHTML = ""
    const add = (cls, title, detail) => { const li = document.createElement("li"); li.className = cls; li.textContent = title; if (detail) { const s = document.createElement("small"); s.textContent = detail; li.appendChild(s) } list.appendChild(li) }
    if (result.ok) add("ok", "All checks passed", `${result.info.displays} display, ${result.info.platform}`)
    for (const issue of result.issues) add("bad", issue.label, issue.detail)
    start.disabled = !result.ok
  }
  recheck.onclick = check
  start.onclick = () => window.secureClientLocal.start()
  check()
</script>
</body>
</html>
